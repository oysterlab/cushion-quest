<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="../chapter1/manifest.webmanifest"><link rel="icon" href="../chapter1/assets/sprites/hud_face_0.webp"><title>내 쿠션 내놔! 인트로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Titan+One&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0d1f;
    --box: #14185a;
    --box-edge: #fff6d8;
    --gold: #ffd23a;
    --gold-deep: #e8590c;
    --text: #fffaf0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: "Do Hyeon", system-ui, sans-serif; color: var(--text);
    user-select: none; cursor: pointer;
  }

  /* 4:3 cabinet screen */
  #screen {
    position: relative;
    width: min(100vw, calc(100vh * 4 / 3));
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--ink);
    container-type: inline-size;
  }
  .scene {
    position: absolute; inset: 0;
    opacity: 0; transition: opacity .45s steps(6);
  }
  .scene.on { opacity: 1; }
  .scene .cam, .scene .fxc { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
  .scene img, .scene .ph {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform-origin: 50% 50%;
    image-rendering: auto;
  }
  .ph {
    display: grid; place-items: center;
    font-family: "Press Start 2P", monospace; font-size: 2cqw; color: #8890c8;
    background: repeating-linear-gradient(45deg, #1a1f55 0 20px, #151a48 20px 40px);
  }

  /* camera moves */
  @keyframes kb-in   { from { transform: scale(1.02); } to { transform: scale(1.14) translate(-2%, 1%); } }
  @keyframes kb-out  { from { transform: scale(1.18) translate(3%, 0); } to { transform: scale(1.03); } }
  @keyframes kb-pan  { from { transform: scale(1.15) translate(4%, 0); } to { transform: scale(1.15) translate(-4%, 0); } }
  @keyframes kb-up   { from { transform: scale(1.2) translate(0, -5%); } to { transform: scale(1.06) translate(0, 0); } }
  @keyframes kb-push { from { transform: scale(1); } to { transform: scale(1.1); } }

  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-1.2cqw, .6cqw); }
    40% { transform: translate(1cqw, -.8cqw); }
    60% { transform: translate(-.7cqw, -.4cqw); }
    80% { transform: translate(.5cqw, .5cqw); }
  }
  #screen.shake { animation: shake .35s steps(5) 1; }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
  #flash.go { animation: flash .3s steps(3) 1; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  /* onomatopoeia */
  .sfx {
    position: absolute; z-index: 6;
    font-family: "Black Han Sans", sans-serif; font-size: 9cqw; line-height: 1;
    color: var(--gold);
    -webkit-text-stroke: .5cqw var(--ink);
    paint-order: stroke fill;
    text-shadow: .5cqw .6cqw 0 var(--gold-deep), .9cqw 1.1cqw 0 var(--ink);
    transform: rotate(-8deg) scale(0);
    animation: pop .4s cubic-bezier(.2, 1.8, .4, 1) forwards;
  }
  @keyframes pop { to { transform: rotate(-8deg) scale(1); } }

  /* dialogue box, arcade style */
  #talk {
    position: absolute; left: 3%; right: 3%; bottom: 3.5%; z-index: 7;
    min-height: 19%;
    padding: 2.2cqw 3cqw 2.4cqw;
    background: linear-gradient(180deg, #2a30a0 0%, var(--box) 60%);
    border: .55cqw solid var(--box-edge);
    border-radius: 1.2cqw;
    box-shadow: 0 0 0 .5cqw var(--ink), .9cqw .9cqw 0 .5cqw rgba(0,0,0,.55);
    font-size: 3.6cqw; line-height: 1.35;
    text-shadow: .25cqw .25cqw 0 var(--ink);
    display: none;
  }
  #talk.on { display: block; }
  #talk.narr { background: rgba(5, 6, 20, .82); border-color: #8d93c9; text-align: center; font-size: 3.3cqw; }
  #name {
    position: absolute; top: -3.6cqw; left: 2.4cqw;
    padding: .7cqw 1.8cqw;
    font-family: "Black Han Sans", sans-serif; font-size: 2.6cqw;
    color: var(--ink); background: var(--gold);
    border: .45cqw solid var(--ink); border-radius: .8cqw;
    text-shadow: none;
  }
  #name:empty { display: none; }
  #next {
    position: absolute; right: 2.2cqw; bottom: 1.3cqw;
    width: 0; height: 0;
    border-left: 1.1cqw solid transparent; border-right: 1.1cqw solid transparent;
    border-top: 1.3cqw solid var(--gold);
    animation: blink .6s steps(2) infinite; display: none;
  }
  #talk.done #next { display: block; }
  @keyframes blink { 50% { opacity: 0; } }

  /* title card */
  #title {
    position: absolute; inset: 0; z-index: 9;
    display: none; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 5%;
  }
  #title.on { display: flex; }
  #title .sub {
    font-family: "Press Start 2P", monospace; font-size: 1.6cqw; color: #fff;
    letter-spacing: .3cqw; text-shadow: .3cqw .3cqw 0 var(--ink);
    opacity: 0; animation: fadein .3s steps(3) .9s forwards;
  }
  #title h1 {
    margin: 1.4cqw 0 0;
    font-family: "Black Han Sans", sans-serif; font-weight: 400;
    font-size: 12cqw; line-height: 1; letter-spacing: -.2cqw;
    color: var(--gold);
    -webkit-text-stroke: .7cqw var(--ink); paint-order: stroke fill;
    text-shadow: 0 .8cqw 0 var(--gold-deep), 0 1.6cqw 0 var(--ink), 0 2.4cqw 1.5cqw rgba(0,0,0,.5);
    transform: translateY(-140%) scale(1.2);
    animation: drop .7s cubic-bezier(.3, 1.6, .5, 1) forwards;
  }
  #title h1 span { color: #ff5a4e; text-shadow: 0 .8cqw 0 #8f1020, 0 1.6cqw 0 var(--ink); }
  @keyframes drop { to { transform: translateY(0) scale(1); } }
  @keyframes fadein { to { opacity: 1; } }
  @keyframes fadeout { to { opacity: 0; } }
  #press {
    position: absolute; bottom: 7%; left: 0; right: 0; text-align: center;
    font-family: "Press Start 2P", monospace; font-size: 2.2cqw; color: #fff;
    text-shadow: .3cqw .3cqw 0 var(--ink);
    animation: blink 1s steps(2) infinite 1.4s; opacity: 0;
  }
  #title.on #press { opacity: 1; }

  /* CRT */
  #crt {
    position: absolute; inset: 0; z-index: 10; pointer-events: none;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 62%, rgba(0,0,0,.5) 100%);
  }
  * { -webkit-tap-highlight-color: transparent; }
  /* touch screens: no keyboard hints */
  @media (pointer: coarse) { #skip, #hint { display: none !important; } }
  #skip {
    position: fixed; top: 10px; right: 12px; z-index: 20;
    font-family: "Press Start 2P", monospace; font-size: 10px; color: #8d93c9;
  }
  #hint {
    position: fixed; bottom: 8px; left: 0; right: 0; text-align: center; z-index: 20;
    font-size: 13px; color: #5b6090;
    animation: fadeout 1s 4s forwards;
  }
#skip,#press{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}#skip{padding:12px;z-index:50;pointer-events:auto}#press{font-family:"Press Start 2P",monospace}#press:focus-visible,#skip:focus-visible{outline:2px solid #ffd23a}</style>
</head>
<body>

  <div id="flash"></div>
  <div id="talk"><div id="name"></div><div id="line"></div><div id="next"></div></div>
  <div id="title">
    <div class="sub">A CUSHION RESCUE STORY</div>
    <h1>내 쿠션 <span>내놔!</span></h1>
    <button id="press" type="button">PRESS START</button>
  </div>
  <div id="crt"></div>
</div>
<button id="skip" type="button" aria-label="인트로 건너뛰기">SKIP ›</button>
<div id="hint">클릭 · Z · Space · Enter 로 진행</div>
